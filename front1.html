<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Women's Support Platform</title>
    <style>
        /* Basic styles */
        body {
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 0;
            background: #f4f8fb;
            color: #333;
        }

        header {
            background: #4CAF50;
            color: white;
            padding: 15px;
            text-align: center;
        }

        .container {
            max-width: 800px;
            margin: 20px auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
        }

        h1, h2 {
            color: #4CAF50;
        }

        label {
            display: block;
            margin: 10px 0 5px;
            font-weight: bold;
        }

        input, textarea {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            background: #4CAF50;
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: #45a049;
        }

        footer {
            text-align: center;
            padding: 10px;
            background: #333;
            color: white;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <header>
        <h1>Women's Secure Support Platform</h1>
        <p>Empowering and Supporting Women with Confidence</p>
    </header>

    <div class="container">
        <h2>User Registration</h2>
        <form id="registration-form">
            <label for="username">Name:</label>
            <input type="text" id="username" name="username" placeholder="Enter your name" required>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" placeholder="Enter your email" required>

            <label for="password">Password:</label>
            <input type="password" id="password" name="password" placeholder="Enter your password" required>

            <button type="submit">Register</button>
        </form>

        <h2>Report an Incident</h2>
        <form id="incident-form">
            <label for="location">Location:</label>
            <input type="text" id="location" name="location" placeholder="Incident location" required>

            <label for="description">Incident Description:</label>
            <textarea id="description" name="description" rows="4" placeholder="Describe the incident" required></textarea>

            <button type="submit" href="https://backy.py">Report Incident</button>
        </form>
    </div>

    <footer>
        <p>&copy; 2025 Women's Support Platform. All rights reserved.</p>
    </footer>
</body>
</html>
